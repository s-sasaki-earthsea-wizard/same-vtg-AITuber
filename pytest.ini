[pytest]
# Pytest configuration for same-vtg-AITuber

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = app/tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Environment variable file
env_files = .env

# Markers for test categorization
markers =
    integration: marks tests as integration tests (making actual API calls)
    unit: marks tests as unit tests (no external dependencies)
